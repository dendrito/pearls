<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pearl Minimal home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Instrument+Serif&amp;family=Geist+Mono:wght@400;500&amp;family=Frank+Ruhl+Libre:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{fg}}; font-family: {{body}}; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 14px; height: 14px; border-radius: 7px; background: radial-gradient(circle at 35% 30%, #ffffff, #d9d6cf 55%, #a9a59c)"></div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.18em">PEARLS</span>
    </div>
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}">TUE · 26 TISHREI</span>
  </header>
  <div style="padding: 44px 24px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}">FOR TONIGHT</span>
    <h1 style="margin: 0; font-family: {{display}}; font-weight: {{dw}}; font-size: 46px; line-height: 1; letter-spacing: -0.03em">Laws of<br>Kiddush</h1>
    <span lang="he" dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; font-size: 20px; color: {{muted}}; text-align: left; margin-top: 6px">הלכות קידוש</span>
  </div>
  <div style="padding: 20px 24px 0; display: flex; align-items: center; gap: 14px">
    <button aria-label="Play" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 15px; font-weight: 500">Shabbat · ch. 6</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}">23 MIN · 10 SECTIONS</span>
    </div>
    <div style="display: flex; border: 1px solid {{line}}; border-radius: 999px; padding: 2px">
      <button style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: {{fg}}; color: {{bg}}; font-family: 'Geist Mono', monospace; font-size: 12px">EN</button>
      <button lang="he" style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: {{fg}}; font-family: 'Frank Ruhl Libre', serif; font-size: 15px">עב</button>
    </div>
  </div>
  <section style="padding: 40px 24px 0; display: flex; flex-direction: column">
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}; padding-bottom: 10px; border-bottom: 1px solid {{line}}">CONTINUE</span>
    <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid {{line}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}; width: 22px">25</span><span style="flex: 1; font-size: 17px">Meat and Milk</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{muted}}">AI · 12 MIN</span></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid {{line}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}; width: 22px">04</span><span style="flex: 1; font-size: 17px">Self-Sacrifice</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{muted}}">AI · 31 MIN</span></div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid {{line}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}; width: 22px">11</span><span style="flex: 1; font-size: 17px">Borer (Separating)</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{muted}}">EN · 18 MIN</span></div>
  </section>
  <section style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{muted}}">PLAYLISTS</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <a href="#" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid {{line}}; border-radius: 999px; color: {{fg}}; text-decoration: none; font-size: 14px">Shabbat Essentials</a>
      <a href="#" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid {{line}}; border-radius: 999px; color: {{fg}}; text-decoration: none; font-size: 14px">The 39 Melakhot</a>
      <a href="#" style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid {{line}}; border-radius: 999px; color: {{fg}}; text-decoration: none; font-size: 14px">Short Pearls</a>
    </div>
  </section>
  <nav style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em">
    <a href="#" style="color: {{fg}}; text-decoration: none; padding: 14px 0; border-top: 2px solid {{fg}}">HOME</a>
    <a href="#" style="color: {{muted}}; text-decoration: none; padding: 14px 0; border-top: 2px solid transparent">BOOKS</a>
    <a href="#" style="color: {{muted}}; text-decoration: none; padding: 14px 0; border-top: 2px solid transparent">LISTS</a>
    <a href="#" style="color: {{muted}}; text-decoration: none; padding: 14px 0; border-top: 2px solid transparent">SEARCH</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["original","sand","ice","night","mint"],"default":"original"},"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#ff4f00","options":["#ff4f00","#2b59ff","#00a67e","#111111"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const V = {
      sand: { bg: '#efe9dd', fg: '#1f1b16', muted: '#6d6457', line: '#d9d0bf', accent: '#c2410c', onAccent: '#ffffff', display: "'Instrument Serif', serif", dw: '400', body: 'Geist, sans-serif' },
      ice: { bg: '#eef2f6', fg: '#0b1726', muted: '#5b6b7d', line: '#d3dbe4', accent: '#2b59ff', onAccent: '#ffffff', display: 'Geist, sans-serif', dw: '600', body: 'Geist, sans-serif' },
      night: { bg: '#0a0a0a', fg: '#f2efe8', muted: '#8f8a80', line: '#26241f', accent: '#e2b65c', onAccent: '#1a1408', display: "'Instrument Serif', serif", dw: '400', body: 'Geist, sans-serif' },
      mint: { bg: '#0b1210', fg: '#e3f1ea', muted: '#7f9a8e', line: '#1f2c27', accent: '#3ddc97', onAccent: '#06231a', display: "'Geist Mono', monospace", dw: '500', body: "'Geist Mono', monospace" }
    };
    const v = V[this.props.variant ?? 'original'];
    if (v) return v;
    const dark = this.props.dark ?? false;
    const base = dark
      ? { bg: '#0b0b0c', fg: '#ededea', muted: '#8d8d93', line: '#26262a' }
      : { bg: '#f5f5f2', fg: '#111111', muted: '#6b6b6b', line: '#dcdcd6' };
    return Object.assign(base, { accent: this.props.accent ?? '#ff4f00', onAccent: '#ffffff', display: 'Geist, sans-serif', dw: '300', body: 'Geist, sans-serif' });
  }
}
</script>
</body>
</html>
