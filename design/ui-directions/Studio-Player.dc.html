<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Frank+Ruhl+Libre:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e0e10; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px 22px 30px">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Close player" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1c1c20; color: #f2f2f2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div style="display: flex; padding: 3px; border-radius: 22px; background: #1c1c20">
      <button style="height: 38px; padding: 0 18px; border: 0; border-radius: 19px; background: {{accent}}; color: #0e0e10; font-weight: 700">English</button>
      <button lang="he" style="height: 38px; padding: 0 18px; border: 0; border-radius: 19px; background: transparent; color: #f2f2f2; font-family: 'Frank Ruhl Libre', serif; font-size: 16px">עברית</button>
    </div>
    <button aria-label="Queue" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1c1c20; color: #f2f2f2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </header>
  <div style="flex: 1; border-radius: 28px; background: #18181c; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9a9aa2">Sections</span>
    <div style="display: flex; align-items: flex-end; gap: 5px; height: 150px">
      <div style="flex: 1; height: 60%; border-radius: 6px; background: {{accent}}"></div>
      <div style="flex: 1; height: 85%; border-radius: 6px; background: {{accent}}; outline: 2px solid #f2f2f2; outline-offset: 2px"></div>
      <div style="flex: 1; height: 45%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 70%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 100%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 50%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 65%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 40%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 80%; border-radius: 6px; background: #34343c"></div>
      <div style="flex: 1; height: 55%; border-radius: 6px; background: #34343c"></div>
    </div>
    <span style="font-size: 14px; color: #c9c9cf">Each bar is a section, sized by length. Tap one to jump.</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 30px; font-weight: 700; line-height: 1.05">Laws of Kiddush</span>
    <span style="font-size: 15px; color: #9a9aa2">§2 Fulfilling the Mitzva of Zakhor · Shabbat 6</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="height: 6px; border-radius: 6px; background: #2a2a31"><div style="width: 34%; height: 6px; border-radius: 6px; background: {{accent}}"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9a9aa2"><span>1:04</span><span>−2:01</span></div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #34343c; background: transparent; color: #f2f2f2; font-weight: 700">1.25×</button>
    <button aria-label="Previous section" style="width: 48px; height: 48px; border: 0; background: transparent; color: #f2f2f2"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.2v11.6a1 1 0 0 1-1.5.86L9 13.5V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v3.5l8.5-5.16A1 1 0 0 1 19 6.2Z"/></svg></button>
    <button aria-label="Pause" style="width: 80px; height: 80px; border-radius: 40px; border: 0; background: {{accent}}; color: #0e0e10; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button>
    <button aria-label="Next section" style="width: 48px; height: 48px; border: 0; background: transparent; color: #f2f2f2"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.2v11.6a1 1 0 0 0 1.5.86L15 13.5V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v3.5L6.5 5.34A1 1 0 0 0 5 6.2Z"/></svg></button>
    <button aria-label="Sleep timer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #34343c; background: transparent; color: #f2f2f2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c6f36b","options":["#c6f36b","#ffb86b","#8fd3ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c6f36b' };
  }
}
</script>
</body>
</html>
